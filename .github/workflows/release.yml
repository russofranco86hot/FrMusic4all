name: Build & Release FrMusic4all APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GMS Debug APK
        run: ./gradlew :app:assembleGmsDebug

      - name: Rename APK for release
        run: |
          mkdir -p output
          cp app/build/outputs/apk/gms/debug/app-gms-debug.apk output/FrMusic4all.apk
          cp app/build/outputs/apk/gms/debug/app-gms-debug.apk output/FrMusic4all-WearOS.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FrMusic4All ${{ github.ref_name }}
          body: |
            ### 🎵 FrMusic4All ${{ github.ref_name }}

            ¡Bienvenido a la nueva versión de **FrMusic4All**!
            
            #### 🌟 Novedades:
            - 🖤 **Modo AMOLED Puro:** Fondo negro absoluto (#000000) en todos los componentes para ahorro de batería.
            - ⌚ **APK para Wear OS Standalone:** Incluye APK específico para relojes inteligentes Wear OS para funcionar de forma autónoma.
            - 📻 **Radio Mundial en Vivo Continua:** Soporte completo de transmisiones HLS (`.m3u8`), favoritos e importación/exportación M3U.
            - 📡 **Soporte de Cast & Echo:** Compatibilidad con Google Cast, dispositivos Amazon Echo y salida Bluetooth para relojes y altavoces.
            - 🎤 **Letras Sincronizadas en Tiempo Real:** Botón dedicado para seguir la letra sincronizada estilo karaoke.
            - ⚙️ **Acerca de... Simplificado:** Pantalla renovada con versión dinámica (${{ github.ref_name }}) y autoría de RUSSOFRANCO86.
            
            #### 📲 Instalación:
            - **Celulares y Tablets Android:** Descarga `FrMusic4all.apk`.
            - **Relojes Wear OS (Galaxy Watch, Pixel Watch):** Descarga `FrMusic4all-WearOS.apk` e instálalo vía ADB o Wear Installer.
          files: |
            output/FrMusic4all.apk
            output/FrMusic4all-WearOS.apk
